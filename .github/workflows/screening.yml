name: Atlantis Screening

on:
  # Scheduling moved to the VPS crontab (exact 30-min timing - GitHub's
  # own `schedule` trigger is best-effort and can lag hours under load).
  # Kept as workflow_dispatch only, for manual runs/testing.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atlantis-screening
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run screening and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/run_screening_and_notify.py

      - name: Generate dashboard
        run: python3 scripts/generate_dashboard.py

      - name: Commit updated state and outputs
        run: |
          git config user.name "atlantis-bot"
          git config user.email "atlantis-bot@users.noreply.github.com"
          git add state/ outputs/watchlist_evaluation.csv outputs/portfolio_traders.csv outputs/active_portfolio_signals.csv outputs/trade_log.csv docs/index.html
          git diff --cached --quiet || git commit -m "Screening run: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
